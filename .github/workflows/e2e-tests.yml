# =============================================================================
# e2e-tests.yml — Run Playwright E2E tests on PRs and pushes to main
# =============================================================================
# Runs E2E tests against:
#   1. A local Next.js dev server (for PR checks) — API proxied to production
#   2. Production (https://vallecanete.com) on main pushes (smoke only)
# =============================================================================

name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/e2e-tests.yml"
  workflow_dispatch:

jobs:
  # ── E2E on local dev server (PRs only) ─────────────────────────────────
  e2e-local:
    name: E2E Tests (local)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke + marketplace + auth)
        working-directory: Frontend
        env:
          CI: true
          # Proxy API requests to production backend via next.config.ts rewrites
          API_BACKEND_URL: https://vallecanete.com
        # Skip tenant-config (needs backend PUT) and mobile (redundant in CI)
        run: npx playwright test --project=smoke --project=marketplace --project=auth

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-local
          path: |
            Frontend/e2e-results.json
            Frontend/playwright-report/
          retention-days: 7

  # ── Smoke tests against production (main pushes) ───────────────────────
  e2e-prod-smoke:
    name: E2E Smoke Tests (production)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        working-directory: Frontend
        env:
          CI: true
          BASE_URL: https://vallecanete.com
          NEXT_PUBLIC_API_URL: https://vallecanete.com
        run: npx playwright test --project=smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-prod
          path: |
            Frontend/e2e-results.json
            Frontend/playwright-report/
          retention-days: 7