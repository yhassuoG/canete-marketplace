# =============================================================================
# deploy-vps.yml — CD: build images locally, push to VPS via SSH, deploy
# =============================================================================
# Secrets necesarios en GitHub (Settings > Secrets and variables > Actions):
#   VPS_HOST        — IP publica del VPS (ej: 168.1.2.3)
#   VPS_USER        — usuario SSH (ej: deploy)
#   VPS_SSH_KEY     — clave privada SSH (contenido completo de id_ed25519)
#   DEPLOY_PATH     — ruta en VPS (ej: /home/deploy/canete)
#   JWT_SECRET      — secreto JWT produccion
#   DB_PASSWORD     — password postgres produccion
#   MP_ACCESS_TOKEN — token Mercado Pago produccion
#   MP_PUBLIC_KEY   — public key Mercado Pago produccion
#   MP_SANDBOX      — true o false
# =============================================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite disparar manualmente

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Clone backend repo (it's gitignored in this repo) ----------------
      - name: Clone backend repo
        run: |
          git clone https://x-access-token:${{ secrets.GHCR_PAT }}@github.com/yhassuoG/canete-api.git Backend
          ls Backend/Dockerfile

      # --- Setup SSH --------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Normalizar line endings: CRLF -> LF
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # --- Sync project files (docker-compose, Caddyfile, db scripts, Backend) --
      - name: Sync project files to VPS
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude '.next' \
            --exclude '*.env' \
            --exclude '.github' \
            --exclude 'infra/vps-ssh-key.txt' \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # --- Create .env on VPS from secrets ----------------------------------
      - name: Write .env on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cat > ${{ secrets.DEPLOY_PATH }}/.env << 'ENV'
            PUBLIC_URL=https://vallecanete.com
            DB_USER=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MP_ACCESS_TOKEN=${{ secrets.MP_ACCESS_TOKEN }}
            MP_PUBLIC_KEY=${{ secrets.MP_PUBLIC_KEY }}
            MP_SANDBOX=${{ secrets.MP_SANDBOX }}
            WHATSAPP_ENABLED=false
            ENV
          EOF

      # --- Apply DB migrations on VPS ----------------------------------------
      - name: Apply DB migrations on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Aplicando migraciones a la base de datos..."
            for f in infra/db/*.sql; do
              echo "  → $f"
              docker exec -i canete-postgres-1 psql -U postgres -d canete_marketplace -f "/docker-entrypoint-initdb.d/$(basename $f)" 2>&1 || true
            done
            echo "✓ Migraciones aplicadas"
          EOF

      # --- Build backend image & deploy on VPS -------------------------------
      - name: Build and deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            # El Caddyfile ya tiene vallecanete.com hardcodeado — no requiere sed
            # Build backend image locally on VPS from source (avoids stale GHCR image)
            docker build -t ghcr.io/yhassuog/canete-api:latest -f Backend/Dockerfile Backend/
            # Force rebuild frontend WITHOUT cache (fixes stale .next layer issues)
            docker compose -f docker-compose.prod.yml build --no-cache web
            # Deploy (web uses freshly-built image, api uses locally-built image)
            docker compose -f docker-compose.prod.yml up -d
            # Limpieza de imagenes viejas
            docker image prune -f
          EOF

      # --- Health check -----------------------------------------------------
      - name: Health check
        run: |
          sleep 15
          # Esperar a que Caddy responda (HTTPS puede tardar en emitir cert)
          for i in $(seq 1 12); do
            if curl -skf "https://vallecanete.com" -o /dev/null; then
              echo "✅ Frontend OK"
              break
            fi
            echo "Esperando... ($i/12)"
            sleep 10
          done
          # API health
          curl -skf "https://vallecanete.com/api/v1/actuator/health" || \
            echo "⚠️ API health no responde aún (puede estar iniciando)"
