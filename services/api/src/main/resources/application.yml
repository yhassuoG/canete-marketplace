server:
  port: 8080

spring:
  application:
    name: marketplace-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/canete_marketplace?currentSchema=canete_marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:172.26.220.127}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:change-me-super-secret-key-change-me}
  whatsapp:
    # Twilio WhatsApp Business API credentials
    # Set TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM as env vars in production
    enabled: ${WHATSAPP_ENABLED:true}
    account-sid: ${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
    auth-token: ${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
    # WhatsApp sender: Twilio number in format whatsapp:+14155238886
    from-number: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  mercadopago:
    # Credenciales de Mercado Pago (Sandbox por defecto)
    # Obtén tus credenciales en: https://www.mercadopago.com.pe/developers/panel
    # Sandbox (test): APP_USR-... | Producción: APP_USR-... (verificada)
    access-token: ${MP_ACCESS_TOKEN:TEST-1234567890-test-access-token-placeholder}
    public-key: ${MP_PUBLIC_KEY:TEST-1234567890-test-public-key-placeholder}
    # true = Sandbox (no cobra dinero real), false = Producción
    sandbox: ${MP_SANDBOX:true}
    # URL base de la API de MP (cambia para producción: https://api.mercadopago.com)
    api-base-url: ${MP_API_BASE_URL:https://api.mercadopago.com}
    # URL del frontend para redirección después del pago
    frontend-url: ${MP_FRONTEND_URL:http://localhost:3000}
    # Token para validar webhooks (configúralo en el panel de MP)
    webhook-secret: ${MP_WEBHOOK_SECRET:wh-webhook-secret-placeholder}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
