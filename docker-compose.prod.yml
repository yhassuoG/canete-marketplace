# =============================================================================
# Produccion — Oracle Cloud Free / Hetzner VPS
# Stack: web (Next.js) + api (Spring Boot) + postgres + redis + caddy (HTTPS)
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================
services:
  web:
    build:
      context: ./apps/web
    environment:
      # En produccion el frontend llama a /api/* que Caddy rutea al backend
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://canete.sslip.io}
    expose:
      - "3000"
    restart: unless-stopped

  api:
    # Pre-built image from GitHub Container Registry (built by yhassuoG/canete-api repo)
    image: ghcr.io/yhassuog/canete-api:latest
    environment:
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-c4n3t3-m4rk3tpl4c3-pr0d-s3cr3t-k3y-2026-ch4ng3-m3}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/canete_marketplace?currentSchema=canete_marketplace
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_SANDBOX: ${MP_SANDBOX:-true}
      MP_API_BASE_URL: https://api.mercadopago.com
      MP_FRONTEND_URL: ${PUBLIC_URL:-https://canete.sslip.io}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-wh-canete-secret}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: canete_marketplace
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d canete_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Caddy: HTTPS automatico con Let's Encrypt (gratis, renueva solo)
  # Usa sslip.io para resolver la IP publica del VPS sin dominio propio.
  # Si despues tienes dominio, cambia Caddyfile y listo.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
